name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job 1: PR Validation
  pr-validation:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Check if title follows conventional commits format
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+ ]]; then
            echo "✅ PR title follows conventional commits format"
          else
            echo "❌ PR title should follow format: type(scope): description"
            echo "   Examples: feat(api): add new endpoint, fix(ui): resolve button styling"
            exit 1
          fi

      - name: Check PR description
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "⚠️  PR description is empty. Please add a description."
            exit 1
          else
            echo "✅ PR has a description"
          fi

  # Job 2: Changed Files Analysis
  changed-files:
    name: Analyze Changed Files
    runs-on: ubuntu-latest

    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}
      docs_changed: ${{ steps.changes.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'
              - '*.md'

      - name: Report changes
        run: |
          echo "Backend changed: ${{ steps.changes.outputs.backend }}"
          echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
          echo "Docs changed: ${{ steps.changes.outputs.docs }}"

  # Job 3: Backend PR Checks (conditional)
  backend-pr-checks:
    name: Backend PR Checks
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.backend_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run quick tests
        run: |
          cd backend
          pytest tests/unit/ -v --maxfail=3
        env:
          SECRET_KEY: test-secret-key
          RATE_LIMIT_ENABLED: 'false'

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const message = `## Backend Tests Results\n\n✅ Backend tests passed successfully!`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # Job 4: Frontend PR Checks (conditional)
  frontend-pr-checks:
    name: Frontend PR Checks
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.frontend_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const message = `## Frontend Build Results\n\n✅ Frontend build passed successfully!`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # Job 5: Code Coverage Report
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: changed-files
    if: needs.changed-files.outputs.backend_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Generate coverage
        run: |
          cd backend
          pytest tests/ --cov=app --cov-report=json
        env:
          SECRET_KEY: test-secret-key
          RATE_LIMIT_ENABLED: 'false'

      - name: Extract coverage percentage
        id: coverage
        run: |
          cd backend
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Comment coverage on PR
        uses: actions/github-script@v6
        with:
          script: |
            const coverage = ${{ steps.coverage.outputs.coverage }};
            const coverageColor = coverage >= 80 ? '🟢' : coverage >= 60 ? '🟡' : '🔴';
            const message = `## Test Coverage Report\n\n${coverageColor} **${coverage.toFixed(2)}%** coverage\n\n` +
                          `Target: 80% (${coverage >= 80 ? '✅ Met' : '❌ Not Met'})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  # Job 6: PR Size Check
  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR size
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let size = 'small';
            let emoji = '✅';
            if (total > 1000) {
              size = 'extra large';
              emoji = '⚠️';
            } else if (total > 500) {
              size = 'large';
              emoji = '⚠️';
            } else if (total > 200) {
              size = 'medium';
              emoji = '✅';
            }

            const message = `## PR Size: ${emoji} ${size}\n\n` +
                          `- **Additions:** ${additions}\n` +
                          `- **Deletions:** ${deletions}\n` +
                          `- **Total changes:** ${total}\n\n` +
                          (total > 500 ? '⚠️ Consider breaking this into smaller PRs for easier review.' : '');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
