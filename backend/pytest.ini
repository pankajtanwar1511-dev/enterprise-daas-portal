[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (fast, fully mocked)
    integration: Integration tests (database, API)
    slow: Slow tests (may take >1s)
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:rostest
    -p no:launch_testing
    -p no:launch_testing_ros_pytest_entrypoint
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
    -p no:launch-testing-ros
filterwarnings =
    ignore::DeprecationWarning
